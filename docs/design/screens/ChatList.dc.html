<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Chatlar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.tx}}; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="padding: 20px 20px 12px; background: {{t.sf}}; border-bottom: 1px solid {{t.ln}}; display: flex; flex-direction: column; gap: 12px">
<h1 style="margin: 0; font-size: 24px; font-weight: 700">Chatlar</h1>
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: {{t.mu}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>Chat faqat soʻrov qabul qilingandan keyin ochiladi</span>
</div>
<div style="flex: 1; overflow: hidden; display: flex; flex-direction: column">
<sc-for list="{{chats}}" as="c" hint-placeholder-count="3">
<a href="Chat.dc.html" style="display: flex; gap: 12px; align-items: center; padding: 14px 20px; border-bottom: 1px solid {{t.ln}}; text-decoration: none; color: {{t.tx}}; background: {{c.bg}}">
<span style="position: relative; flex-shrink: 0"><span style="width: 52px; height: 52px; border-radius: 26px; background: {{c.avBg}}; color: {{c.avFg}}; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">{{c.ini}}</span><span style="position: absolute; right: -4px; bottom: -4px; width: 26px; height: 26px; box-sizing: border-box; border-radius: 6px; border: 2px solid {{t.bg}}; background: {{c.ph}}"></span></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="display: flex; align-items: center; justify-content: space-between; gap: 8px"><span style="font-size: 16px; font-weight: 600">{{c.who}}</span><span style="font-size: 12px; color: {{t.mu}}">{{c.time}}</span></span>
<span style="font-size: 13px; color: {{t.mu}}">{{c.item}}</span>
<span style="display: flex; align-items: center; justify-content: space-between; gap: 8px"><span style="font-size: 14px; color: {{c.msgColor}}; font-weight: {{c.w}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.msg}}</span><span style="min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 11px; background: {{c.badgeBg}}; color: {{c.badgeFg}}; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{c.badge}}</span></span>
</span>
</a>
</sc-for>
</div>
<nav style="height: 80px; flex-shrink: 0; background: {{t.sf}}; border-top: 1px solid {{t.ln}}; display: flex; align-items: center; justify-content: space-around; padding: 0 8px">
<a href="Home.dc.html" style="width: 64px; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{t.mu}}; font-size: 12px; font-weight: 500"><span style="height: 30px; display: flex; align-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg></span>Lenta</a>
<a href="MapView.dc.html" style="width: 64px; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{t.mu}}; font-size: 12px; font-weight: 500"><span style="height: 30px; display: flex; align-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"></path><path d="M9 4v14M15 6v14"></path></svg></span>Xarita</a>
<a href="Create1.dc.html" style="width: 64px; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{t.tx}}; font-size: 12px; font-weight: 600"><span style="width: 40px; height: 30px; border-radius: 10px; background: {{t.pr}}; color: {{t.onPr}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>Qoʻshish</a>
<a href="ChatList.dc.html" aria-current="page" style="width: 64px; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{t.onPrC}}; font-size: 12px; font-weight: 600"><span style="width: 56px; height: 30px; border-radius: 15px; background: {{t.prC}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg></span>Chatlar</a>
<a href="Profile.dc.html" style="width: 64px; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{t.mu}}; font-size: 12px; font-weight: 500"><span style="height: 30px; display: flex; align-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></span>Profil</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>

{ ini:'SR', who:'Sardor R.', item:'Pasport, koʻk muqovali', msg:'Pasport rasmini koʻrdingizmi? Sizniki boʻlishi mumkin', time:'Kecha', avBg:t.prC, avFg:t.onPrC, ph:t.ph1, bg:'transparent', msgColor:t.mu, w:400, badge:'', badgeBg:'transparent', badgeFg:'transparent' },

];

</script>
</body>
</html>
