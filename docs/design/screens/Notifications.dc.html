<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Bildirishnomalar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.tx}}; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="height: 64px; flex-shrink: 0; padding: 8px 8px 8px 8px; box-sizing: border-box; background: {{t.sf}}; border-bottom: 1px solid {{t.ln}}; display: flex; align-items: center; gap: 4px">
<a href="Home.dc.html" aria-label="Orqaga" style="width: 48px; height: 48px; color: {{t.tx}}; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<h1 style="margin: 0; flex: 1; font-size: 20px; font-weight: 700">Bildirishnomalar</h1>
<button onClick="{{readAll}}" style="height: 48px; padding: 0 12px; border: none; background: transparent; color: {{t.pr}}; font-family: inherit; font-size: 14px; font-weight: 600">Oʻqildi</button>
</div>
<div style="flex: 1; overflow: hidden; display: flex; flex-direction: column">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<div style="padding: 16px 20px 6px; font-size: 13px; font-weight: 600; color: {{t.mu}}">{{g.label}}</div>
<sc-for list="{{g.items}}" as="n" hint-placeholder-count="3">
<a href="{{n.href}}" style="display: flex; gap: 12px; padding: 12px 20px; background: {{n.bg}}; text-decoration: none; color: {{t.tx}}; align-items: flex-start">
<span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; background: {{n.iconBg}}; color: {{n.iconFg}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 15px; line-height: 21px; font-weight: {{n.w}}">{{n.text}}</span><span style="font-size: 13px; color: {{t.mu}}">{{n.time}}</span></span>
<span style="width: 10px; height: 10px; margin-top: 6px; border-radius: 5px; background: {{n.dot}}; flex-shrink: 0"></span>
</a>
</sc-for>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { read: false }; }
renderVals() {
const L={bg:'#F4F6FA',sf:'#FFFFFF',ln:'#DCE2EC',tx:'#172033',mu:'#556070',pr:'#2B5FD9',prC:'#E3EBFC',onPrC:'#1D45A8',fd:'#157347',fdC:'#DFF3E8',ls:'#A4441A',lsC:'#FCEBDD',wn:'#8A5A12',wnC:'#FDF1D8',unread:'#EDF2FD'};
const D={bg:'#0F1420',sf:'#182031',ln:'#2A3550',tx:'#E6EBF5',mu:'#9AA6BB',pr:'#8DB0FF',prC:'#233A72',onPrC:'#D6E2FF',fd:'#7ED6A5',fdC:'#17382A',ls:'#F3A77E',lsC:'#43281A',wn:'#F2C46D',wnC:'#3D2E12',unread:'#16203A'};
const t = (this.props.theme ?? 'light') === 'dark' ? D : L;
const I = {
shield:'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM9 12l2 2 4-4',
search:'M11 4a7 7 0 1 1 0 14 7 7 0 0 1 0-14zM20 20l-3.5-3.5',
chat:'M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z',
check:'M5 12l5 5L20 7',
heart:'M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z',
clock:'M12 3a9 9 0 1 1 0 18 9 9 0 0 1 0-18zM12 7v5l3 2'
};
const r = this.state.read;
const mk = (o) => ({ ...o, bg: o.unread && !r ? t.unread : 'transparent', dot: o.unread && !r ? t.pr : 'transparent', w: o.unread && !r ? 600 : 400 });
const groups = [
{ label: 'Bugun', items: [
mk({ href:'Claims.dc.html', icon:I.shield, iconBg:t.prC, iconFg:t.onPrC, text:'“Qora charm hamyon” eʼloningizga yangi soʻrov keldi. Javobni tekshiring.', time:'5 daqiqa oldin', unread:true }),
mk({ href:'Chat.dc.html', icon:I.chat, iconBg:t.prC, iconFg:t.onPrC, text:'Malika K. sizga xabar yozdi', time:'12 daqiqa oldin', unread:true }),
mk({ href:'Detail.dc.html', icon:I.search, iconBg:t.lsC, iconFg:t.ls, text:'“Pasport” eʼloningizga oʻxshash buyum topildi: Olmazor', time:'1 soat oldin', unread:true })
]},
{ label: 'Shu hafta', items: [
mk({ href:'Chat.dc.html', icon:I.check, iconBg:t.fdC, iconFg:t.fd, text:'Soʻrovingiz qabul qilindi! Endi topuvchi bilan yozishishingiz mumkin.', time:'Kecha, 19:20', unread:false }),
mk({ href:'Success.dc.html', icon:I.heart, iconBg:t.fdC, iconFg:t.fd, text:'Kalitlar egasiga qaytdi. Rahmat, sizdek insonlar koʻpaysin!', time:'18-oktabr', unread:false }),
mk({ href:'Profile.dc.html', icon:I.clock, iconBg:t.wnC, iconFg:t.wn, text:'“Ryukzak” eʼloningiz 3 kundan soʻng arxivlanadi. Yangilaysizmi?', time:'16-oktabr', unread:false })
]}
];
return { t, groups, readAll: () => this.setState({ read: true }) };
}
}
</script>
</body>
</html>
