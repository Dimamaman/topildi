<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>SMS kod</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.tx}}; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; padding: 8px 24px 32px">
<div style="height: 56px; display: flex; align-items: center; margin-left: -12px"><a href="SignIn.dc.html" aria-label="Orqaga" style="width: 48px; height: 48px; border-radius: 12px; color: {{t.tx}}; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a></div>
<div style="padding-top: 16px; display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 700; letter-spacing: -0.01em">Kodni kiriting</h1>
<p style="margin: 0; font-size: 16px; line-height: 24px; color: {{t.tx2}}"><b style="color: {{t.tx}}">+998 90 *** ** 67</b> raqamiga 6 xonali kod yubordik.</p>
</div>
<div style="padding-top: 32px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px" role="group" aria-label="SMS kod">
<sc-for list="{{boxes}}" as="b" hint-placeholder-count="6">
<input aria-label="{{b.label}}" maxlength="1" inputmode="numeric" value="{{b.v}}" style="height: 60px; width: 100%; box-sizing: border-box; text-align: center; border-radius: 12px; border: {{b.border}}; background: {{t.sf}}; color: {{t.tx}}; font-family: inherit; font-size: 24px; font-weight: 700; outline: none">
</sc-for>
</div>
<div style="padding-top: 20px; display: flex; justify-content: center; min-height: 48px; align-items: center">
<sc-if value="{{waiting}}" hint-placeholder-val="{{true}}">
<span style="font-size: 15px; color: {{t.mu}}">Kodni qayta yuborish: <b style="color: {{t.tx}}; font-variant-numeric: tabular-nums">0:{{secs}}</b></span>
</sc-if>
<sc-if value="{{ready}}" hint-placeholder-val="{{false}}">
<button onClick="{{resend}}" style="height: 48px; padding: 0 12px; border: none; background: transparent; color: {{t.pr}}; font-family: inherit; font-size: 15px; font-weight: 600">Kodni qayta yuborish</button>
</sc-if>
</div>
<div style="flex: 1"></div>
<div style="display: flex; flex-direction: column; gap: 8px">
<a href="ProfileSetup.dc.html" style="height: 52px; border-radius: 12px; background: {{t.pr}}; color: {{t.onPr}}; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; text-decoration: none">Tasdiqlash</a>
<a href="SignIn.dc.html" style="height: 48px; display: flex; align-items: center; justify-content: center; color: {{t.pr}}; font-size: 15px; font-weight: 600; text-decoration: none">Raqamni oʻzgartirish</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { s: 45 }; }
componentDidMount() { this.timer = setInterval(() => { this.setState((st) => ({ s: Math.max(0, st.s - 1) })); }, 1000); }
componentWillUnmount() { clearInterval(this.timer); }
renderVals() {
const L={bg:'#F4F6FA',sf:'#FFFFFF',ln:'#DCE2EC',ol:'#8792A6',tx:'#172033',tx2:'#344055',mu:'#556070',pr:'#2B5FD9',onPr:'#FFFFFF'};
const D={bg:'#0F1420',sf:'#182031',ln:'#2A3550',ol:'#5D6A84',tx:'#E6EBF5',tx2:'#C2CBDB',mu:'#9AA6BB',pr:'#8DB0FF',onPr:'#0B2A6B'};
const t = (this.props.theme ?? 'light') === 'dark' ? D : L;
const vals = ['4','8','2','7','',''];
const boxes = vals.map((v, i) => ({ v, label: (i + 1) + '-raqam', border: i === 4 ? '2px solid ' + t.pr : '1px solid ' + (v ? t.ol : t.ln) }));
const s = this.state.s;
return { t, boxes, secs: String(s).padStart(2, '0'), waiting: s > 0, ready: s === 0, resend: () => this.setState({ s: 59 }) };
}
}
</script>
</body>
</html>
