<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Filtrlar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.tx}}; font-family: 'Inter', system-ui, sans-serif; position: relative; overflow: hidden">
<!-- dimmed feed behind -->
<div style="padding: 16px 20px; display: flex; flex-direction: column; gap: 12px" aria-hidden="true">
<div style="height: 48px; border-radius: 12px; background: {{t.sf}}"></div>
<div style="height: 48px; border-radius: 12px; background: {{t.sf}}"></div>
<div style="height: 124px; border-radius: 12px; background: {{t.sf}}"></div>
<div style="height: 124px; border-radius: 12px; background: {{t.sf}}"></div>
</div>
<a href="Home.dc.html" aria-label="Yopish" style="position: absolute; inset: 0; background: {{t.scr}}"></a>
<div role="dialog" aria-label="Filtrlar" style="position: absolute; left: 0; right: 0; bottom: 0; height: 700px; box-sizing: border-box; border-radius: 24px 24px 0 0; background: {{t.sf}}; box-shadow: 0 -8px 32px {{t.sh}}; display: flex; flex-direction: column">
<div style="padding: 10px 20px 0; display: flex; flex-direction: column; gap: 6px">
<span style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: {{t.ln}}"></span>
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-size: 20px; font-weight: 700">Filtrlar</h2>
<button onClick="{{reset}}" style="height: 48px; padding: 0 4px; border: none; background: transparent; color: {{t.pr}}; font-family: inherit; font-size: 15px; font-weight: 600">Tozalash</button>
</div>
</div>
<div style="flex: 1; overflow: hidden; padding: 4px 20px 0; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; font-weight: 600">Kategoriya</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="9">
<button onClick="{{c.toggle}}" aria-pressed="{{c.on}}" style="height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font-family: inherit; font-size: 14px; font-weight: {{c.w}}">{{c.label}}</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; font-weight: 600">Hudud</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button style="height: 52px; padding: 0 12px 0 14px; border-radius: 12px; border: 1px solid {{t.ol}}; background: {{t.sf}}; color: {{t.tx}}; font-family: inherit; text-align: left; display: flex; flex-direction: column; justify-content: center; gap: 1px"><span style="font-size: 12px; color: {{t.mu}}">Shahar / viloyat</span><span style="font-size: 15px; font-weight: 600">Toshkent</span></button>
<button style="height: 52px; padding: 0 12px 0 14px; border-radius: 12px; border: 1px solid {{t.ol}}; background: {{t.sf}}; color: {{t.tx}}; font-family: inherit; text-align: left; display: flex; flex-direction: column; justify-content: center; gap: 1px"><span style="font-size: 12px; color: {{t.mu}}">Tuman</span><span style="font-size: 15px; font-weight: 600">Chilonzor</span></button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; font-weight: 600">Sana</span>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid {{t.ol}}; border-radius: 12px; overflow: hidden">
<sc-for list="{{dates}}" as="d" hint-placeholder-count="4">
<button onClick="{{d.pick}}" aria-pressed="{{d.on}}" style="height: 44px; border: none; border-right: 1px solid {{t.ln}}; background: {{d.bg}}; color: {{d.fg}}; font-family: inherit; font-size: 14px; font-weight: 600">{{d.label}}</button>
</sc-for>
</div>
<div style="height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; background: {{t.sf2}}; display: flex; align-items: center; gap: 10px; font-size: 15px; color: {{t.tx2}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>13-oktabr — 20-oktabr, 2026</div>
</div>
</div>
<div style="padding: 12px 20px 24px; border-top: 1px solid {{t.ln}}">
<a href="Home.dc.html" style="height: 52px; border-radius: 12px; background: {{t.pr}}; color: {{t.onPr}}; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; text-decoration: none">{{cta}}</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { sel: ['Hujjatlar', 'Hamyonlar'], date: '7 kun' }; }
renderVals() {
const L={bg:'#F4F6FA',sf:'#FFFFFF',sf2:'#EEF1F6',ln:'#DCE2EC',ol:'#8792A6',tx:'#172033',tx2:'#344055',mu:'#556070',pr:'#2B5FD9',onPr:'#FFFFFF',prC:'#E3EBFC',onPrC:'#1D45A8',scr:'rgba(15,20,32,0.45)',sh:'rgba(23,32,51,0.18)'};
const D={bg:'#0F1420',sf:'#182031',sf2:'#212A3D',ln:'#2A3550',ol:'#5D6A84',tx:'#E6EBF5',tx2:'#C2CBDB',mu:'#9AA6BB',pr:'#8DB0FF',onPr:'#0B2A6B',prC:'#233A72',onPrC:'#D6E2FF',scr:'rgba(0,0,0,0.6)',sh:'rgba(0,0,0,0.5)'};
const t = (this.props.theme ?? 'light') === 'dark' ? D : L;
const sel = this.state.sel;
const labels = ['Hujjatlar','Telefonlar','Kalitlar','Hamyonlar','Sumkalar','Elektronika','Kiyim','Bolalar buyumlari','Boshqa'];
const cats = labels.map((label) => { const on = sel.includes(label); return { label, on, bg: on ? t.prC : t.sf, fg: on ? t.onPrC : t.tx, border: on ? t.prC : t.ln, w: on ? 600 : 500, toggle: () => this.setState({ sel: on ? sel.filter((x) => x !== label) : [...sel, label] }) }; });
const dates = ['Bugun','7 kun','30 kun','Tanlash'].map((label) => { const on = this.state.date === label; return { label, on, bg: on ? t.prC : t.sf, fg: on ? t.onPrC : t.tx2, pick: () => this.setState({ date: label }) }; });
const n = sel.length === 0 ? 128 : 18 * sel.length + 6;
return { t, cats, dates, cta: n + ' ta natijani koʻrsatish', reset: () => this.setState({ sel: [], date: '30 kun' }) };
}
}
</script>
</body>
</html>
