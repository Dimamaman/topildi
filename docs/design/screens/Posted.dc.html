<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Eʼlon joylandi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.tx}}; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; padding: 56px 24px 32px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center">
<span style="width: 112px; height: 112px; border-radius: 56px; background: {{t.okC}}; color: {{t.ok}}; display: flex; align-items: center; justify-content: center; position: relative"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg><span style="position: absolute; left: -10px; top: 18px; width: 10px; height: 10px; border-radius: 5px; background: {{t.pr}}"></span><span style="position: absolute; right: -6px; bottom: 14px; width: 14px; height: 14px; border-radius: 7px; background: {{t.ok}}"></span></span>
<h1 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 700">Eʼlon joylandi!</h1>
<p style="margin: 0; font-size: 16px; line-height: 24px; color: {{t.tx2}}">Rahmat! Endi egasi sizni topa oladi. Kimdir “Bu meniki” desa, darhol xabar beramiz.</p>
</div>
<div style="margin-top: 28px; border-radius: 16px; background: {{t.sf}}; border: 1px solid {{t.ln}}; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 15px; font-weight: 700">Keyin nima boʻladi?</span>
<sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
<div style="display: flex; gap: 12px; align-items: flex-start"><span style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 14px; background: {{t.prC}}; color: {{t.onPrC}}; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{s.n}}</span><span style="font-size: 14px; line-height: 20px; color: {{t.tx2}}; padding-top: 4px">{{s.text}}</span></div>
</sc-for>
</div>
<div style="flex: 1"></div>
<div style="display: flex; flex-direction: column; gap: 8px">
<a href="Detail.dc.html" style="height: 52px; border-radius: 12px; background: {{t.pr}}; color: {{t.onPr}}; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; text-decoration: none">Eʼlonni koʻrish</a>
<a href="Home.dc.html" style="height: 52px; display: flex; align-items: center; justify-content: center; color: {{t.pr}}; font-size: 16px; font-weight: 600; text-decoration: none">Lentaga qaytish</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const L={bg:'#F4F6FA',sf:'#FFFFFF',ln:'#DCE2EC',tx:'#172033',tx2:'#344055',pr:'#2B5FD9',onPr:'#FFFFFF',prC:'#E3EBFC',onPrC:'#1D45A8',ok:'#1E7A4E',okC:'#DFF3E8'};
const D={bg:'#0F1420',sf:'#182031',ln:'#2A3550',tx:'#E6EBF5',tx2:'#C2CBDB',pr:'#8DB0FF',onPr:'#0B2A6B',prC:'#233A72',onPrC:'#D6E2FF',ok:'#7ED6A5',okC:'#17382A'};
const steps = [
{ n:'1', text:'Soʻrov kelsa, javobni yashirin belgi bilan solishtirasiz.' },
{ n:'2', text:'Mos kelsa, qabul qilasiz va chatda uchrashuvni kelishasiz.' },
{ n:'3', text:'Buyumni gavjum, xavfsiz joyda topshirasiz.' }
];
return { t: (this.props.theme ?? 'light') === 'dark' ? D : L, steps };
}
}
</script>
</body>
</html>
