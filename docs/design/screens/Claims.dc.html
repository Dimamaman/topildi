<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Soʻrovlar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.tx}}; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="height: 64px; flex-shrink: 0; padding: 8px; box-sizing: border-box; background: {{t.sf}}; border-bottom: 1px solid {{t.ln}}; display: flex; align-items: center; gap: 4px">
<a href="Notifications.dc.html" aria-label="Orqaga" style="width: 48px; height: 48px; color: {{t.tx}}; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 17px; font-weight: 700">Soʻrovlar · 2</span><span style="font-size: 13px; color: {{t.mu}}">Qora charm hamyon</span></span>
</div>
<div style="flex: 1; overflow: hidden; padding: 16px 20px; display: flex; flex-direction: column; gap: 14px">
<div style="padding: 14px; border-radius: 12px; border: 2px solid {{t.pr}}; background: {{t.prC2}}; display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: {{t.onPrC}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>Siz yozgan yashirin belgi</span>
<span style="font-size: 16px; line-height: 23px; font-weight: 600">Ichida koʻk rangli bank kartasi va kutubxona chiptasi bor</span>
</div>
<span style="font-size: 14px; line-height: 20px; color: {{t.tx2}}">Javoblarni belgi bilan solishtiring. Toʻgʻri javob bergan odamni qabul qiling.</span>
<sc-for list="{{claims}}" as="c" hint-placeholder-count="2">
<div style="padding: 14px; border-radius: 12px; background: {{t.sf}}; border: 1px solid {{t.ln}}; display: flex; flex-direction: column; gap: 12px; opacity: {{c.op}}">
<div style="display: flex; align-items: center; gap: 10px">
<span style="width: 40px; height: 40px; border-radius: 20px; background: {{c.avBg}}; color: {{c.avFg}}; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">{{c.ini}}</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 15px; font-weight: 600">{{c.who}}</span><span style="font-size: 12px; color: {{t.mu}}">{{c.when}}</span></span>
<span style="padding: 3px 8px; border-radius: 6px; background: {{c.sBg}}; color: {{c.sFg}}; font-size: 12px; font-weight: 600">{{c.status}}</span>
</div>
<div style="padding: 10px 12px; border-radius: 10px; background: {{t.sf2}}; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; font-weight: 600; color: {{t.mu}}">Javobi</span><span style="font-size: 15px; line-height: 22px">{{c.answer}}</span></div>
<sc-if value="{{c.pending}}" hint-placeholder-val="{{true}}">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button onClick="{{c.reject}}" style="height: 48px; border-radius: 12px; border: 1px solid {{t.er}}; background: transparent; color: {{t.er}}; font-family: inherit; font-size: 15px; font-weight: 600">Rad etish</button>
<a href="Chat.dc.html" style="height: 48px; border-radius: 12px; background: {{t.pr}}; color: {{t.onPr}}; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; text-decoration: none">Qabul qilish</a>
</div>
</sc-if>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { rejected: [] }; }
renderVals() {
const L={bg:'#F4F6FA',sf:'#FFFFFF',sf2:'#EEF1F6',ln:'#DCE2EC',tx:'#172033',tx2:'#344055',mu:'#556070',pr:'#2B5FD9',onPr:'#FFFFFF',prC2:'#EDF2FD',onPrC:'#1D45A8',er:'#C2362B',erC:'#FBE3E0',wn:'#8A5A12',wnC:'#FDF1D8',lsC:'#FCEBDD',ls:'#A4441A',prC:'#E3EBFC'};
const D={bg:'#0F1420',sf:'#182031',sf2:'#212A3D',ln:'#2A3550',tx:'#E6EBF5',tx2:'#C2CBDB',mu:'#9AA6BB',pr:'#8DB0FF',onPr:'#0B2A6B',prC2:'#16203A',onPrC:'#D6E2FF',er:'#FF8A80',erC:'#4A1D1A',wn:'#F2C46D',wnC:'#3D2E12',lsC:'#43281A',ls:'#F3A77E',prC:'#233A72'};
const t = (this.props.theme ?? 'light') === 'dark' ? D : L;
const rej = this.state.rejected;
const base = [
{ id:1, ini:'MK', who:'Malika K.', when:'5 daqiqa oldin', answer:'Ichida koʻk rangli bank kartam va kutubxona chiptam bor. Chiptada ismim yozilgan.', avBg:t.lsC, avFg:t.ls },
{ id:2, ini:'AT', who:'Anvar T.', when:'40 daqiqa oldin', answer:'Qora hamyon, ichida pul bor edi.', avBg:t.prC, avFg:t.onPrC }
];
const claims = base.map((c) => { const r = rej.includes(c.id); return { ...c, pending: !r, op: r ? 0.6 : 1, status: r ? 'Rad etildi' : 'Kutilmoqda', sBg: r ? t.erC : t.wnC, sFg: r ? t.er : t.wn, reject: () => this.setState({ rejected: [...rej, c.id] }) }; });
return { t, claims };
}
}
</script>
</body>
</html>
