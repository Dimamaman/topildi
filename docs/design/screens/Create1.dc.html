<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Eʼlon 1-qadam</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.tx}}; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="flex-shrink: 0; background: {{t.sf}}; border-bottom: 1px solid {{t.ln}}; padding: 8px 8px 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 4px">
<a href="Home.dc.html" aria-label="Yopish" style="width: 48px; height: 48px; color: {{t.tx}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<span style="flex: 1; font-size: 17px; font-weight: 700">Yangi eʼlon</span>
<span style="padding-right: 12px; font-size: 14px; color: {{t.mu}}; font-weight: 500">1 / 3</span>
</div>
<div style="padding: 0 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px" role="progressbar" aria-valuenow="1" aria-valuemin="1" aria-valuemax="3" aria-label="1-qadam: rasm va tur">
<span style="height: 4px; border-radius: 2px; background: {{t.pr}}"></span><span style="height: 4px; border-radius: 2px; background: {{t.ln}}"></span><span style="height: 4px; border-radius: 2px; background: {{t.ln}}"></span>
</div>
</div>
<div style="flex: 1; overflow: hidden; padding: 20px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 12px">
<h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700">Nima boʻldi?</h1>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px" role="radiogroup">
<button role="radio" aria-checked="{{foundOn}}" onClick="{{pickFound}}" style="padding: 14px; border-radius: 12px; border: {{foundBorder}}; background: {{foundBg}}; color: {{t.tx}}; font-family: inherit; text-align: left; display: flex; flex-direction: column; gap: 10px">
<span style="width: 40px; height: 40px; border-radius: 20px; background: {{t.fdC}}; color: {{t.fd}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 11V6a2 2 0 0 1 4 0v4M11 10V4a2 2 0 0 1 4 0v6M15 9a2 2 0 0 1 4 0v5a7 7 0 0 1-7 7h-1a6 6 0 0 1-5-3l-2.5-4a1.8 1.8 0 0 1 3-2L7 14"></path></svg></span>
<span style="font-size: 16px; font-weight: 700">Topdim</span><span style="font-size: 13px; line-height: 18px; color: {{t.mu}}">Egasini topishga yordam beraman</span></button>
<button role="radio" aria-checked="{{lostOn}}" onClick="{{pickLost}}" style="padding: 14px; border-radius: 12px; border: {{lostBorder}}; background: {{lostBg}}; color: {{t.tx}}; font-family: inherit; text-align: left; display: flex; flex-direction: column; gap: 10px">
<span style="width: 40px; height: 40px; border-radius: 20px; background: {{t.lsC}}; color: {{t.ls}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></span>
<span style="font-size: 16px; font-weight: 700">Yoʻqotdim</span><span style="font-size: 13px; line-height: 18px; color: {{t.mu}}">Buyumimni qidiryapman</span></button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: baseline; justify-content: space-between"><h2 style="margin: 0; font-size: 17px; font-weight: 700">Rasmlar</h2><span style="font-size: 13px; color: {{t.mu}}">2 / 6</span></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div style="aspect-ratio: 1; border-radius: 10px; background: {{t.ph1}}; color: {{t.phI}}; position: relative; display: flex; align-items: center; justify-content: center"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h12v4M5 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7M16 13.5h.01"></path></svg><span style="position: absolute; left: 6px; bottom: 6px; padding: 2px 6px; border-radius: 4px; background: {{t.pr}}; color: {{t.onPr}}; font-size: 11px; font-weight: 600">Asosiy</span><button aria-label="Rasmni oʻchirish" style="position: absolute; top: 0; right: 0; width: 44px; height: 44px; border: none; background: transparent; padding: 0; display: flex; align-items: flex-start; justify-content: flex-end"><span style="margin: 6px; width: 24px; height: 24px; border-radius: 12px; background: rgba(15,20,32,0.7); color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></span></button></div>
<div style="aspect-ratio: 1; border-radius: 10px; background: {{t.ph2}}; position: relative"><button aria-label="Rasmni oʻchirish" style="position: absolute; top: 0; right: 0; width: 44px; height: 44px; border: none; background: transparent; padding: 0; display: flex; align-items: flex-start; justify-content: flex-end"><span style="margin: 6px; width: 24px; height: 24px; border-radius: 12px; background: rgba(15,20,32,0.7); color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></span></button></div>
<button style="aspect-ratio: 1; border-radius: 10px; border: 1.5px dashed {{t.ol}}; background: {{t.sf}}; color: {{t.pr}}; font-family: inherit; font-size: 13px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Qoʻshish</button>
</div>
<div style="display: flex; gap: 10px; padding: 12px 14px; border-radius: 12px; background: {{t.wnC}}; color: {{t.wn}}; font-size: 13px; line-height: 19px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="M12 3l9.5 17h-19z"></path><path d="M12 10v4M12 17h.01"></path></svg><span>Rasmda karta raqami, hujjat maʼlumotlari yoki ichidagi narsalar koʻrinmasin. Ular egasini tekshirish uchun kerak.</span></div>
</div>
</div>
<div style="flex-shrink: 0; padding: 12px 20px 24px; background: {{t.sf}}; border-top: 1px solid {{t.ln}}">
<a href="Create2.dc.html" style="height: 52px; border-radius: 12px; background: {{t.pr}}; color: {{t.onPr}}; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; text-decoration: none">Keyingi</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { type: 'found' }; }
renderVals() {
const L={bg:'#F4F6FA',sf:'#FFFFFF',ln:'#DCE2EC',ol:'#8792A6',tx:'#172033',mu:'#556070',pr:'#2B5FD9',onPr:'#FFFFFF',fd:'#157347',fdC:'#DFF3E8',ls:'#A4441A',lsC:'#FCEBDD',wn:'#8A5A12',wnC:'#FDF1D8',ph1:'#DCE4F2',ph2:'#D3DCEC',phI:'#5B6F94'};
const D={bg:'#0F1420',sf:'#182031',ln:'#2A3550',ol:'#5D6A84',tx:'#E6EBF5',mu:'#9AA6BB',pr:'#8DB0FF',onPr:'#0B2A6B',fd:'#7ED6A5',fdC:'#17382A',ls:'#F3A77E',lsC:'#43281A',wn:'#F2C46D',wnC:'#3D2E12',ph1:'#2A3550',ph2:'#243047',phI:'#9AA6BB'};
const t = (this.props.theme ?? 'light') === 'dark' ? D : L;
const f = this.state.type === 'found';
return { t,
foundOn: f ? 'true' : 'false', lostOn: f ? 'false' : 'true',
foundBorder: f ? '2px solid ' + t.fd : '1px solid ' + t.ln, foundBg: f ? t.fdC : t.sf,
lostBorder: f ? '1px solid ' + t.ln : '2px solid ' + t.ls, lostBg: f ? t.sf : t.lsC,
pickFound: () => this.setState({ type: 'found' }), pickLost: () => this.setState({ type: 'lost' }) };
}
}
</script>
</body>
</html>
